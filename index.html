<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Football League Press Conference</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; max-width: 1200px; margin: 0 auto; }
        header { text-align: center; padding: 20px 0; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
        header h1 { font-size: 2rem; color: var(--accent-gold); text-transform: uppercase; margin-bottom: 6px; }
        header p { color: var(--text-muted); font-size: 0.95rem; }
        .layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
        .sidebar { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
        .sidebar h2 { font-size: 1rem; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase; }
        .manager-list { display: flex; flex-direction: column; gap: 8px; max-height: 700px; overflow-y: auto; }
        .manager-btn { display: flex; align-items: center; justify-content: space-between; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; padding: 10px; color: var(--text-main); cursor: pointer; text-align: left; }
        .manager-btn:hover { border-color: var(--accent-blue); }
        .manager-btn.active { border-color: var(--accent-gold); background: #282013; }
        .rank-badge { background: var(--border); color: #fff; font-weight: bold; font-size: 0.8rem; padding: 3px 6px; border-radius: 4px; min-width: 30px; text-align: center; }
        .manager-info { flex-grow: 1; margin: 0 10px; }
        .manager-name { font-weight: 600; font-size: 0.9rem; }
        .team-name { font-size: 0.75rem; color: var(--text-muted); }
        .record { font-size: 0.8rem; font-weight: bold; color: var(--accent-blue); }
        .stage-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .stage-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .current-coach h2 { font-size: 1.5rem; color: var(--accent-gold); }
        .current-coach p { color: var(--text-muted); font-size: 0.9rem; }
        .status-pill { background: #0f172a; border: 1px solid var(--border); padding: 4px 10px; border-radius: 15px; font-size: 0.8rem; color: var(--accent-blue); }
        .controls { display: flex; gap: 10px; background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid var(--border); }
        .btn { background: var(--accent-blue); color: #fff; border: none; padding: 8px 14px; border-radius: 5px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .btn-stop { background: #ef4444; }
        .qa-list { display: flex; flex-direction: column; gap: 12px; }
        .qa-card { background: #0f172a; border: 1px solid var(--border); border-radius: 6px; padding: 14px; }
        .qa-card.speaking { border-color: var(--accent-gold); }
        .question { font-weight: 600; color: var(--accent-blue); margin-bottom: 6px; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
        .answer { color: var(--text-main); font-size: 0.9rem; line-height: 1.4; }
        .play-single-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 2px 6px; border-radius: 3px; font-size: 0.7rem; cursor: pointer; }
        .play-single-btn:hover { color: #fff; border-color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>Fantasy Football Post-Game Press Conference</h1>
        <p>Week 4 Media Briefing — Hear from all 12 Managers</p>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <h2>Power Rankings</h2>
            <div class="manager-list" id="managerList"></div>
        </aside>

        <main class="stage-container">
            <div class="stage-header">
                <div class="current-coach">
                    <h2 id="coachName">Select a Coach</h2>
                    <p id="teamDetails">Choose a manager from the rankings to start.</p>
                </div>
                <div class="status-pill" id="coachRank">Rank --</div>
            </div>

            <div class="controls">
                <button class="btn" id="playAllBtn">Play Full Conference</button>
                <button class="btn btn-stop" id="stopBtn">Stop Audio</button>
            </div>

            <div class="qa-list" id="qaList"></div>
        </main>
    </div>

    <script>
        const coaches = [
            {
                rank: 1, name: "Kyle K", team: "(Jonathan) Taylor's Version", record: "4-0", points: "498.36 PF", pitch: 1.15, rate: 1.05,
                qas: [
                    { q: "Reporter: Kyle, 4-0 and top 3 in scoring every week. How feeling?", a: "To quote The Wolf of Wall Street: I am not leaving! We are 40 and 4 in all-play. Walker, Doubs, Taylor, Bowers are all executing at an elite level." },
                    { q: "Reporter: Mahomes finally started after three weeks on the bench?", a: "Mahomes was an expensive bench ornament, but when you have a Ferrari, eventually you take it out on the highway." },
                    { q: "Reporter: You left Monangai's 28 points on the bench?", a: "If we swap them, we hit 154.4 points. But as Gladiator says: What we do in life echoes in eternity. We still got the win." },
                    { q: "Reporter: AJ Brown returning soon?", a: "When AJ Brown comes off IR, it is game over. Rest of the league is playing for second place." },
                    { q: "Reporter: Message to the league?", a: "Keep chasing. You come at the king, you best not miss." }
                ]
            },
            {
                rank: 2, name: "Billy Wilson", team: "New Kid on the Block", record: "2-2", points: "527.52 PF", pitch: 1.0, rate: 1.1,
                qas: [
                    { q: "Reporter: 29 more points than anyone else, but 2-2?", a: "It is a statistical anomaly! We are 33-11 in all-play. Moneyball said: How can you not be romantic about baseball? The wins will come." },
                    { q: "Reporter: Nico Collins came back with 30.8 points?", a: "Nico is an absolute engine. Between him and Zay Flowers with 25.8, our receivers are unstoppable." },
                    { q: "Reporter: Jahmyr Gibbs fell short of projection?", a: "Gibbs had 17.7 points. In what world is 17.7 a disappointment? We won comfortably." },
                    { q: "Reporter: Both Caleb Williams and Jayden Daniels are out?", a: "Tyler Shough is carrying the load right now. Improvise, adapt, overcome until the young guys get healthy." },
                    { q: "Reporter: Will luck turn around soon?", a: "We have 527 points. Bad luck cannot outrun elite production forever." }
                ]
            },
            {
                rank: 3, name: "David Schleicher", team: "Murray? Present", record: "2-2", points: "439.06 PF", pitch: 0.9, rate: 0.95,
                qas: [
                    { q: "Reporter: Left 79.5 points on your bench while scoring 78?", a: "Houston, we have a problem. Leaving Brian Robinson and Hockenson on the pine while McConkey goose-eggs is painful." },
                    { q: "Reporter: Bench swaps would have won you the week easily?", a: "Any Given Sunday said it best: Football is a game of inches. Or in my case, bench points." },
                    { q: "Reporter: Power rankings say lineup management is 11th best?", a: "The roster is nasty! You are ranking the vehicle, not the driver. Once I fix the cockpit, we take off." },
                    { q: "Reporter: How do you fix the lineup process?", a: "Strict pre-game protocols. No more gut feelings over cold hard projections." },
                    { q: "Reporter: Still confident in this roster?", a: "100 percent. The horsepower is under the hood. The driver just needs to put it in drive." }
                ]
            },
            {
                rank: 4, name: "Adam Edgerly", team: "Mamba Mentality", record: "3-1", points: "418.24 PF", pitch: 1.05, rate: 1.0,
                qas: [
                    { q: "Reporter: Puka Nacua returned with 27.7 points?", a: "Mamba mentality! Kobe said job is not finished. Puka came back and proved why he is the core." },
                    { q: "Reporter: Buried Carson Wentz Forever 123 to 69?", a: "Joe Burrow and Alvin Kamara delivered in the flex. We put them away early and did not look back." },
                    { q: "Reporter: Luck report says you should only have 2 wins?", a: "Luck is preparation meeting opportunity! Call it luck, call it grit, the standings say 3 and 1." },
                    { q: "Reporter: Dalton Kincaid had back to back duds?", a: "Tight end is a battleground. We will tweak the scheme, no panic button." },
                    { q: "Reporter: Outlook for Week 5?", a: "Dominate individual matchups. That is the formula." }
                ]
            },
            {
                rank: 5, name: "Aaron Osten", team: "Chubby Chasers", record: "3-1", points: "389.26 PF", pitch: 1.2, rate: 1.1,
                qas: [
                    { q: "Reporter: Top score of the week at 145.76!", a: "Top Gun style: I feel the need, the need for speed! CeeDee Lamb went nuclear for 41.3!" },
                    { q: "Reporter: Started Emanuel Wilson at RB2 for 27 points?", a: "They called me crazy after his 1.4 last week! Dark Knight taught me: They laughed because I was different!" },
                    { q: "Reporter: Scoring has gone up every single week?", a: "We are skyrocketing! LaPorta, Tate, everyone chipped in. Trendline is pointing straight up!" },
                    { q: "Reporter: Barkley got 2 points, McLaurin out?", a: "Imagine when we get Barkley and Terry back! This is not even our final form!" },
                    { q: "Reporter: Expected wins say you should be 2-2?", a: "I would rather be lucky than good, but right now we are BOTH!" }
                ]
            },
            {
                rank: 6, name: "Keith Garner", team: "We need kickers", record: "2-2", points: "438.64 PF", pitch: 0.95, rate: 0.95,
                qas: [
                    { q: "Reporter: Lost despite a solid score?", a: "Dodgeball said it: Sometimes you are the windshield, sometimes you are the bug. We were the bug." },
                    { q: "Reporter: Juwan Johnson left 11.9 on your bench?", a: "Johnson left 35 points on my bench over two weeks. It is frustrating, we must read the room better." },
                    { q: "Reporter: RB room looks like a hospital wing?", a: "It is an ER ward down there! But Javonte Williams stepping up with 31 points showed we have fight." },
                    { q: "Reporter: Bryce Young put up 21.4 points?", a: "Bryce showed real poise. He gave us a chance when JaMarr Chase struggled." },
                    { q: "Reporter: How stay afloat at 2-2?", a: "Next man up mentality. We patch the boat and keep sailing." }
                ]
            },
            {
                rank: 7, name: "Josh Fenske", team: "King Henry", record: "1-3", points: "440.66 PF", pitch: 0.85, rate: 1.0,
                qas: [
                    { q: "Reporter: McMillan scored 45.2 and you STILL lost by 22?", a: "Tragic! Hunger Games lied, odds are not in my favor! 3rd most points in league and sitting at 1-3!" },
                    { q: "Reporter: Named unluckiest team in the league?", a: "Cold comfort! We are 25-19 in all-play! Every week my opponent plays like the 85 Bears!" },
                    { q: "Reporter: Kelce gave 3.5 while Andrews sat with 13.7?", a: "Even with the right TE swap, we do not catch 134 points. Universe had it out for us." },
                    { q: "Reporter: Jeremiyah Love had 6.5 with Allgeier on bench?", a: "When it rains, it pours. Right process moves, worst-case outcomes." },
                    { q: "Reporter: Message to your team at 1-3?", a: "Hold the line! Law of averages has to kick in eventually." }
                ]
            },
            {
                rank: 8, name: "Zach Spencer", team: "Drop Your Nuts", record: "2-2", points: "411.3 PF", pitch: 1.05, rate: 1.05,
                qas: [
                    { q: "Reporter: Big win over Win At All Costs, Maye over Stafford?", a: "Top Gun rules: You do not have time to think up there. If you think, you are dead. Maye gave us 26 points." },
                    { q: "Reporter: Nabers, Olave, Kraft, Cook delivered?", a: "The core came through. Malik Nabers is a superstar. Olave was steady." },
                    { q: "Reporter: Left Ollie Gordon's 18 on the bench?", a: "Nobody plays a perfect game. We won by 49 points, not losing sleep over RB2 optimization." },
                    { q: "Reporter: Where does team stand at 2-2?", a: "Right in the thick of it. Balanced, aggressive, ready to make a run." },
                    { q: "Reporter: Strategy for next week?", a: "Drop the hammer. Keep starting high-upside plays." }
                ]
            },
            {
                rank: 9, name: "Mike Gant", team: "Fenske's Favorite Team Name", record: "1-3", points: "417.88 PF", pitch: 0.9, rate: 0.9,
                qas: [
                    { q: "Reporter: Faced 516 points against, most in league?", a: "Brutal! Every week feels like walking into a gauntlet. Kyren Williams puts up 36.7 and we still lose by 132." },
                    { q: "Reporter: Kenyon Sadiq got a goose egg at TE?", a: "Pure roulette! Put a chip on black and it hits red every single time." },
                    { q: "Reporter: 5 roster spots filled with injured guys?", a: "Bench looks like a MASH unit. Holding on by a thread." },
                    { q: "Reporter: ZERO waiver moves all season?", a: "I believe in patience. You do not throw the baby out with the bathwater." },
                    { q: "Reporter: Will you make a waiver move this week?", a: "Evaluating. If the right piece is there, maybe. Otherwise, stand firm." }
                ]
            },
            {
                rank: 10, name: "David Archer", team: "Carson Wentz forever", record: "2-2", points: "361.74 PF", pitch: 1.1, rate: 1.0,
                qas: [
                    { q: "Reporter: Scored under 80 twice, still 2-2?", a: "Han Solo said it best: Never tell me the odds! A win is a win, we are 500!" },
                    { q: "Reporter: Started Parker Washington for 2 points over Judkins?", a: "Gambled on matchups and took a hit. 19 point swing hurts." },
                    { q: "Reporter: 10 waiver moves and starting Parker Washington?", a: "Activity shows hustle! Talladega Nights: If you ain't first, you are last!" },
                    { q: "Reporter: Jefferson and Tyreek Hill on bench?", a: "When those two step back on the gridiron, league won't know what hit them. Stashing dynamite!" },
                    { q: "Reporter: Keep winning with sub-80 performances?", a: "Plan on scoring way more, but two wins in the bank!" }
                ]
            },
            {
                rank: 11, name: "Kevin Erdal", team: "Questionable", record: "1-3", points: "373.3 PF", pitch: 0.95, rate: 0.9,
                qas: [
                    { q: "Reporter: First win of the season! Relief?", a: "Shawshank Redemption: Hope is a good thing, maybe the best of things. Finally got off the schneid!" },
                    { q: "Reporter: Bench scored 83.2 points?", a: "Scary! RJ Harvey with 19, Stevenson with 18 sitting there watching Montgomery get 4. Got lucky David left points on bench." },
                    { q: "Reporter: Chuba Hubbard was hero with 25.9 points?", a: "Chuba carried this franchise on his back this weekend! Absolute warrior." },
                    { q: "Reporter: All-play record is worst in league?", a: "Do not look at all-play. Look at scoreboard Sunday night. One win builds confidence." },
                    { q: "Reporter: Changes for Week 5?", a: "Promoting bench players! Harvey and Stevenson earned their stripes." }
                ]
            },
            {
                rank: 12, name: "Dan Koss", team: "Win at all costs", record: "1-3", points: "354.12 PF", pitch: 0.75, rate: 0.8,
                qas: [
                    { q: "Reporter: Lowest points, Mariota 5 pts, Rice 0 pts?", a: "I do not know anymore. Matrix said: Ignorance is bliss. But there is no bliss here. Just pain." },
                    { q: "Reporter: Added Joe Mixon... a free agent without a team?", a: "I thought he would sign somewhere! Trying to be proactive, holding a ghost on my bench instead." },
                    { q: "Reporter: Tee Higgins gave 26 points on bench?", a: "Every decision turns to dust. Titanic hit the iceberg. I am the iceberg, the ship, and the cold water." },
                    { q: "Reporter: Analysts say team built to lose on technicality?", a: "Nothing is fair. We are demoralized, bewildered, heartbroken, and lost in the dark." },
                    { q: "Reporter: What is the plan for Week 5?", a: "To wake up from this nightmare. That is the only plan." }
                ]
            }
        ];

        let selectedCoach = coaches[0];
        let synth = window.speechSynthesis;

        function init() {
            renderManagerList();
            loadCoach(coaches[0]);
        }

        function renderManagerList() {
            const list = document.getElementById('managerList');
            list.innerHTML = coaches.map((c, i) => `
                <div class="manager-btn ${i === 0 ? 'active' : ''}" onclick="selectCoach(${i}, this)">
                    <span class="rank-badge">#${c.rank}</span>
                    <div class="manager-info">
                        <div class="manager-name">${c.name}</div>
                        <div class="team-name">${c.team}</div>
                    </div>
                    <span class="record">${c.record}</span>
                </div>
            `).join('');
        }

        function selectCoach(index, btnEl) {
            document.querySelectorAll('.manager-btn').forEach(b => b.classList.remove('active'));
            if(btnEl) btnEl.classList.add('active');
            synth.cancel();
            loadCoach(coaches[index]);
        }

        function loadCoach(coach) {
            selectedCoach = coach;
            document.getElementById('coachName').innerText = coach.name + " (" + coach.team + ")";
            document.getElementById('teamDetails').innerText = "Record: " + coach.record + " | Total Points: " + coach.points;
            document.getElementById('coachRank').innerText = "Power Rank #" + coach.rank;

            const qaList = document.getElementById('qaList');
            qaList.innerHTML = coach.qas.map((qa, i) => `
                <div class="qa-card" id="qa-${i}">
                    <div class="question">
                        <span>${qa.q}</span>
                        <button class="play-single-btn" onclick="speakText(${i})">Play Answer</button>
                    </div>
                    <div class="answer">${qa.a}</div>
                </div>
            `).join('');
        }

        function speakText(index) {
            synth.cancel();
            document.querySelectorAll('.qa-card').forEach(c => c.classList.remove('speaking'));
            const card = document.getElementById('qa-' + index);
            if (card) card.classList.add('speaking');

            const text = selectedCoach.qas[index].a;
            const utter = new SpeechSynthesisUtterance(text);
            utter.pitch = selectedCoach.pitch;
            utter.rate = selectedCoach.rate;
            utter.onend = function() {
                if (card) card.classList.remove('speaking');
            };
            synth.speak(utter);
        }

        document.getElementById('playAllBtn').onclick = function() {
            synth.cancel();
            let delay = 0;
            selectedCoach.qas.forEach((qa, i) => {
                setTimeout(function() {
                    speakText(i);
                }, delay);
                delay += (qa.a.length * 65) + 1500;
            });
        };

        document.getElementById('stopBtn').onclick = function() {
            synth.cancel();
            document.querySelectorAll('.qa-card').forEach(c => c.classList.remove('speaking'));
        };

        window.onload = init;
    </script>
</body>
</html>
