<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Football League Post-Game Press Conference</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0 30px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
        }

        @media (max-width: 850px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            height: fit-content;
        }

        .sidebar h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .manager-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 700px;
            overflow-y: auto;
        }

        .manager-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .manager-btn:hover {
            border-color: var(--accent-blue);
            background: #182238;
        }

        .manager-btn.active {
            border-color: var(--accent-gold);
            background: #282013;
        }

        .rank-badge {
            background: var(--border);
            color: var(--text-main);
            font-weight: bold;
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 4px;
            min-width: 32px;
            text-align: center;
        }

        .manager-info {
            flex-grow: 1;
            margin: 0 12px;
        }

        .manager-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .team-name {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .record {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .stage-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stage-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .current-coach h2 {
            font-size: 1.8rem;
            color: var(--accent-gold);
        }

        .current-coach p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .status-pill {
            background: #0f172a;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--accent-blue);
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .btn {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-stop {
            background: #ef4444;
        }

        .qa-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .qa-card {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            transition: border-color 0.2s;
        }

        .qa-card.speaking {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
        }

        .question {
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 8px;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .answer {
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .play-single-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .play-single-btn:hover {
            color: var(--text-main);
            border-color: var(--text-main);
        }
    </style>
</head>
<body>

    <header>
        <h1>Fantasy Football Post-Game Press Conference</h1>
        <p>Week 4 Media Briefing — Hear from all 12 Managers</p>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <h2>Power Rankings</h2>
            <div class="manager-list" id="managerList"></div>
        </aside>

        <main class="stage-container">
            <div class="stage-header">
                <div class="current-coach">
                    <h2 id="coachName">Select a Coach</h2>
                    <p id="teamDetails">Choose a manager from the rankings to start the press conference.</p>
                </div>
                <div class="status-pill" id="coachRank">Rank --</div>
            </div>

            <div class="controls">
                <button class="btn" id="playAllBtn">▶ Play Full Press Conference</button>
                <button class="btn btn-stop" id="stopBtn">⏹ Stop Audio</button>
            </div>

            <div class="qa-list" id="qaList"></div>
        </main>
    </div>

    <script>
        const coaches = [
            {
                rank: 1,
                name: "Kyle K",
                team: "(Jonathan) Taylor's Version",
                record: "4-0",
                points: "498.36 PF",
                voicePitch: 1.1,
                voiceRate: 1.05,
                qas: [
                    { q: "Reporter: Kyle, 4-0 and top three in scoring every week. How are you feeling about this run?", a: "To quote 'The Wolf of Wall Street': I'm not leaving! We're 40-4 in all-play. This machine is firing on every cylinder. Kenneth Walker, Romeo Doubs, Jonathan Taylor, Brock Bowers—they're executing at an elite level." },
                    { q: "Reporter: Mahomes finally started after three weeks on the bench. What went into that decision?", a: "Mahomes was a very expensive bench ornament, but when you have a Ferrari in the garage, eventually you take it out on the highway. He did his job, and now we move." },
                    { q: "Reporter: You left Monangai's 28 points on the bench for Lemon's 5.7. Any regrets?", a: "Look, if we swap them, we hit 154.4 and top the league. But in the words of 'Gladiator': 'What we do in life echoes in eternity.' We still got the win. Excellence leaves room for tuning." },
                    { q: "Reporter: AJ Brown and Jalen Coker are heading back soon. How does that change things?", a: "When AJ Brown comes off IR, it’s game over. We’re already standard-setting. Rest of the league is just playing for second place." },
                    { q: "Reporter: What's the message to the rest of the league heading into Week 5?", a: "Keep chasing. 'You come at the king, you best not miss.'" }
                ]
            },
            {
                rank: 2,
                name: "Billy Wilson",
                team: "New Kid on the Block",
                record: "2-2",
                points: "527.52 PF",
                voicePitch: 1.0,
                voiceRate: 1.1,
                qas: [
                    { q: "Reporter: Billy, you have 29 more points than anyone else in the league, but you're sitting at 2-2. How frustrating is that?", a: "It's pure statistical anomaly! We're 33-11 in all-play. In the words of 'Moneyball': 'How can you not be romantic about baseball?' Or in this case, fantasy football. The points are there, the wins will follow." },
                    { q: "Reporter: Nico Collins came back from IR and put up 30.8. How huge was that?", a: "Nico is an absolute engine. Between him and Zay Flowers putting up 25.8, our receivers are unstoppable." },
                    { q: "Reporter: Jahmyr Gibbs fell short of his projection. Any concern there?", a: "Gibbs had 17.7. In what world is 17.7 a disappointment? We still won the week comfortably." },
                    { q: "Reporter: Both Caleb Williams and Jayden Daniels are out. How are you managing the QB room?", a: "Tyler Shough is carrying the load right now. We adapt, we overcome. 'Improvise, adapt, overcome'—that’s our motto until the young guns get healthy." },
                    { q: "Reporter: Do you feel like the luck will turn in your favor soon?", a: "We have 527 points. Bad luck can't outrun elite production forever." }
                ]
            },
            {
                rank: 12,
                name: "Dan Koss",
                team: "Win at all costs",
                record: "1-3",
                points: "354.12 PF",
                voicePitch: 0.8,
                voiceRate: 0.85,
                qas: [
                    { q: "Reporter: Dan, lowest points in the league, starting Mariota for 5.34 points and Rashee Rice for 0. How do you explain this?", a: "I... I don't know anymore. To quote 'The Matrix': 'Ignorance is bliss.' But there is no bliss here. Just pain." },
                    { q: "Reporter: You made four waiver moves this week and added Joe Mixon... who doesn't currently have a team. What was the strategy?", a: "I thought... I thought he'd sign somewhere! I was trying to be proactive! Instead, I'm holding a ghost on my bench." },
                    { q: "Reporter: Tee Higgins gave you 26.7 on the bench. Why wasn't he starting?", a: "Because every decision I make turns to dust. In 'Titanic', the ship hits the iceberg. Right now, I am the iceberg, the ship, and the water." },
                    { q: "Reporter: People are saying your team is built to lose on a technicality. Is that fair?", a: "Fair? Nothing is fair. We scored 74 points. We are demoralized, confused, and lost in the fog." },
                    { q: "Reporter: What is the plan for Week 5?", a: "To wake up from this nightmare. That's the plan." }
                ]
            }
        ];

        let selectedCoach = coaches[0];
        let synth = window.speechSynthesis;

        function init() {
            renderManagerList();
            loadCoach(coaches[0]);
        }

        function renderManagerList() {
            const list = document.getElementById('managerList');
            list.innerHTML = coaches.map((c, i) => `
                <div class="manager-btn ${i === 0 ? 'active' : ''}" onclick="selectCoach(${i}, this)">
                    <span class="rank-badge">#${c.rank}</span>
                    <div class="manager-info">
                        <div class="manager-name">${c.name}</div>
                        <div class="team-name">${c.team}</div>
                    </div>
                    <span class="record">${c.record}</span>
                </div>
            `).join('');
        }

        function selectCoach(index, btnEl) {
            document.querySelectorAll('.manager-btn').forEach(b => b.classList.remove('active'));
            if(btnEl) btnEl.classList.add('active');
            synth.cancel();
            loadCoach(coaches[index]);
        }

        function loadCoach(coach) {
            selectedCoach = coach;
            document.getElementById('coachName').innerText = `${coach.name} (${coach.team})`;
            document.getElementById('teamDetails').innerText = `Record: ${coach.record} | Total Points: ${coach.points}`;
            document.getElementById('coachRank').innerText = `Power Rank #${coach.rank}`;

            const qaList = document.getElementById('qaList');
            qaList.innerHTML = coach.qas.map((qa, i) => `
                <div class="qa-card" id="qa-${i}">
                    <div class="question">
                        <span>${qa.q}</span>
                        <button class="play-single-btn" onclick="speakText('${escapeQuotes(qa.a)}', ${i})">🔊 Play Answer</button>
                    </div>
                    <div class="answer">${qa.a}</div>
                </div>
            `).join('');
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        function speakText(text, index = null) {
            synth.cancel();
            if (index !== null) {
                document.querySelectorAll('.qa-card').forEach(c => c.classList.remove('speaking'));
                const card = document.getElementById(`qa-${index}`);
                if (card) card.classList.add('speaking');
            }

            const utter = new SpeechSynthesisUtterance(text);
            utter.pitch = selectedCoach.voicePitch;
            utter.rate = selectedCoach.voiceRate;
            
            utter.onend = () => {
                document.querySelectorAll('.qa-card').forEach(c => c.classList.remove('speaking'));
            };

            synth.speak(utter);
        }

        document.getElementById('playAllBtn').onclick = () => {
            synth.cancel();
            let delay = 0;
            selectedCoach.qas.forEach((qa, i) => {
                setTimeout(() => {
                    speakText(`${qa.q} ... ${qa.a}`, i);
                }, delay);
                delay += (qa.q.length + qa.a.length) * 60;
            });
        };

        document.getElementById('stopBtn').onclick = () => {
            synth.cancel();
            document.querySelectorAll('.qa-card').forEach(c => c.classList.remove('speaking'));
        };

        window.onload = init;
    </script>
</body>
</html>
