<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Football League Post-Game Press Conference</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0 30px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
        }

        @media (max-width: 850px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            height: fit-content;
        }

        .sidebar h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .manager-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 750px;
            overflow-y: auto;
        }

        .manager-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .manager-btn:hover {
            border-color: var(--accent-blue);
            background: #182238;
        }

        .manager-btn.active {
            border-color: var(--accent-gold);
            background: #282013;
        }

        .rank-badge {
            background: var(--border);
            color: var(--text-main);
            font-weight: bold;
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 4px;
            min-width: 32px;
            text-align: center;
        }

        .manager-info {
            flex-grow: 1;
            margin: 0 12px;
        }

        .manager-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .team-name {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .record {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .stage-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stage-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .current-coach h2 {
            font-size: 1.8rem;
            color: var(--accent-gold);
        }

        .current-coach p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .status-pill {
            background: #0f172a;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--accent-blue);
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .btn {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-stop {
            background: #ef4444;
        }

        .qa-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .qa-card {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            transition: border-color 0.2s;
        }

        .qa-card.speaking {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
        }

        .question {
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 8px;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .answer {
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .play-single-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .play-single-btn:hover {
            color: var(--text-main);
            border-color: var(--text-main);
        }
    </style>
</head>
<body>

            <div class="controls">

                <button class="btn btn-stop" id="stopBtn">⏹ Stop Audio</button>
